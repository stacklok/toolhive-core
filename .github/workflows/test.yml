name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: |
            go.sum
            redisconn/go.sum
            redisconn/aws/go.sum
            redisconn/azure/go.sum
            redisconn/gcp/go.sum

      - name: Download Go dependencies
        run: |
          go mod download
          go mod verify

      - name: Cache Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check standalone Redis modules
        run: |
          ./scripts/check-redisconn-modules.sh
          for module in redisconn redisconn/aws redisconn/azure redisconn/gcp; do
            (cd "$module" && GOWORK=off go mod tidy && GOWORK=off go mod verify && GOWORK=off go test -race ./... && GOWORK=off go vet ./...)
          done
          git diff --exit-code -- redisconn/go.mod redisconn/go.sum redisconn/aws/go.mod redisconn/aws/go.sum redisconn/azure/go.mod redisconn/azure/go.sum redisconn/gcp/go.mod redisconn/gcp/go.sum

      # TODO: Enable after provisioning Codecov
