name: Release

on:
  push:
    tags:
      - 'v*'
      - 'redisconn/v*'
      - 'redisconn/aws/v*'
      - 'redisconn/azure/v*'
      - 'redisconn/gcp/v*'
  workflow_dispatch:
    inputs:
      intended_tag:
        description: Tag that will be created after this preflight passes
        required: true
        type: string
      intended_ref:
        description: Commit SHA or ref that will receive the tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validate Release Commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.intended_ref || github.ref }}

      - name: Validate intended module manifest
        env:
          INTENDED_TAG: ${{ inputs.intended_tag || github.ref_name }}
        run: ./scripts/validate-release.sh "$INTENDED_TAG"

      # toolhive-core is a shared library: a pre-release go-sdk require
      # propagates to every downstream consumer via MVS. Warn on release so
      # it's obvious a go-sdk pre-release is pinned (see the inline comment
      # on the go-sdk require in go.mod), without blocking releases needed
      # before go-sdk v1.7.0 final ships.
      - name: Guard against pre-release go-sdk dependency
        run: |
          if grep -qE 'github\.com/modelcontextprotocol/go-sdk v[0-9]+\.[0-9]+\.[0-9]+-(pre|rc)' go.mod; then
            echo "::warning file=go.mod::go.mod pins a pre-release go-sdk version; confirm this release is intentional before go-sdk final ships"
            grep -nE 'github\.com/modelcontextprotocol/go-sdk v[0-9]+\.[0-9]+\.[0-9]+-(pre|rc)' go.mod
          fi

  release:
    name: Publish Release Artifacts
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload schema artifacts to release
        if: startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            registry/types/data/skill.schema.json \
            registry/types/data/upstream-registry.schema.json \
            registry/types/data/publisher-provided.schema.json \
            --clobber
